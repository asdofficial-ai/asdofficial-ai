<script>
'use strict';
const KEY='asd-forge-v1';
const CURRENCIES={NGN:'₦',USD:'$',GBP:'£',EUR:'€',GHS:'GH₵',KES:'KSh',ZAR:'R'};
const DEFAULT={settings:{name:'My Business',phone:'',email:'',tagline:'Bringing ideas to life',currency:'NGN',payment:''},offers:[],clients:[],invoices:[],activity:[]};
let db=load(),page='overview',editingOffer=null,filter='All',editingClient=null,toastTimer,drawer=false;
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&d.settings&&Array.isArray(d.offers)&&Array.isArray(d.clients)&&Array.isArray(d.invoices))return {...structuredClone(DEFAULT),...d,settings:{...DEFAULT.settings,...d.settings}}}catch(e){}return structuredClone(DEFAULT)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Browser storage is full. Export your backup from Settings.')}}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function trunc(s,n=110){s=String(s||'');return s.length>n?s.slice(0,n)+'…':s}
function money(n){return `${CURRENCIES[db.settings.currency]||'$'}${new Intl.NumberFormat('en',{maximumFractionDigits:2,minimumFractionDigits:0}).format(Number(n)||0)}`}
function currencyMoney(n,c){return `${CURRENCIES[c]||'$'}${new Intl.NumberFormat('en',{maximumFractionDigits:2}).format(Number(n)||0)}`}
function today(){return new Date().toISOString().slice(0,10)}
function datetime(t){return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3300)}
function log(event){db.activity.unshift({id:id(),title:event,time:Date.now()});db.activity=db.activity.slice(0,18)}
function icon(name){const paths={grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',bolt:'<path d="M13 2 4 14h7l-1 8 10-12h-7z"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',receipt:'<path d="M4 3h16v18l-4-2-4 2-4-2-4 2z"/><path d="M8 8h8M8 12h8"/>',spark:'<path d="m12 3 1.7 6.3L20 11l-6.3 1.7L12 19l-1.7-6.3L4 11l6.3-1.7zM19 18l1 3M18 20l3-1"/>',settings:'<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a2 2 0 0 0 .4 2.2l-2.6 2.6a2 2 0 0 0-2.2-.4 2 2 0 0 0-1.1 1.6h-3.7a2 2 0 0 0-1.1-1.6 2 2 0 0 0-2.2.4l-2.6-2.6a2 2 0 0 0 .4-2.2 2 2 0 0 0-1.6-1.1v-3.7a2 2 0 0 0 1.6-1.1 2 2 0 0 0-.4-2.2L6.9 4.3a2 2 0 0 0 2.2.4 2 2 0 0 0 1.1-1.6h3.7A2 2 0 0 0 15 4.7a2 2 0 0 0 2.2-.4l2.6 2.6a2 2 0 0 0-.4 2.2 2 2 0 0 0 1.6 1.1v3.7a2 2 0 0 0-1.6 1.1z"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',check:'<path d="m5 12 4 4L19 6"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',link:'<path d="M10 13a5 5 0 0 0 7 .4l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7-.4l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 9h0M18 15h0"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/>',edit:'<path d="m4 20 4.5-1 11-11-3.5-3.5-11 11zM14 6l3.5 3.5"/>'};return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.bolt}</svg>`}
const NAV=[['overview','Overview','grid'],['studio','Launch studio','bolt'],['clients','Clients & deals','users'],['invoices','Invoices','receipt'],['growth','Growth kit','spark'],['settings','Settings','settings']];
function render(){if(location.hash.startsWith('#offer=')){renderPublic();return}const headings={overview:'Your workspace',studio:'Launch studio',clients:'Client pipeline',invoices:'Invoices & payments',growth:'Growth kit',settings:'Business settings'};document.title=`${headings[page]} — ASD Forge`;document.getElementById('app').innerHTML=`<div class="drawer-cover ${drawer?'open':''}" onclick="toggleDrawer()"></div><div class="app"><aside class="sidebar ${drawer?'open':''}"><div class="brand"><div class="mark">A</div><div><strong>ASD FORGE</strong><span>BUILD · SELL · GROW</span></div></div><div class="nav-group caps">Workspace</div><nav class="nav">${NAV.map(([p,l,i])=>`<button class="nav-btn ${page===p?'active':''}" onclick="navigate('${p}')">${icon(i)}${l}</button>`).join('')}</nav><div class="side-bottom"><div class="eyebrow">✳ THE MISSION</div><strong>Small start. Big vision.</strong><p>Launch a real offer, win real clients, and grow from actual results.</p><button onclick="navigate('growth')">See growth tools ↗</button></div></aside><main class="main"><header class="topbar"><div class="top-left"><button class="hamburger" aria-label="Open menu" onclick="toggleDrawer()">${icon('menu')}</button><div><strong>${headings[page]}</strong><p>Everything you need to sell your next idea.</p></div></div><div class="top-actions"><span class="status">Local workspace</span><button class="btn btn-small" onclick="navigate('studio')">${icon('plus')} New offer</button></div></header><div class="content"><div class="page" id="main-page">${views[page]()}</div><footer class="mini-footer">ASD FORGE · Version 1 · Saved in this browser · Export backups in Settings</footer></div></main></div>`;bindForms()}
function toggleDrawer(){drawer=!drawer;render()}
function navigate(p){page=p;drawer=false;editingOffer=null;render();window.scrollTo({top:0,behavior:'instant'})}
function empty(iconText,title,desc,action='',label=''){return `<div class="empty"><div class="empty-icon">${iconText}</div><h3>${esc(title)}</h3><p>${esc(desc)}</p>${action?`<button class="btn btn-small" onclick="${action}">${esc(label)}</button>`:''}</div>`}
function stat(label,val,desc,glyph){return `<div class="stat"><div class="top"><span>${label}</span><span class="glyph">${glyph}</span></div><div class="val">${val}</div><small>${desc}</small></div>`}
function overview(){const paid=db.invoices.filter(i=>i.status==='Paid').reduce((a,b)=>a+(+b.total||0),0);const active=db.clients.filter(c=>!['Won','Lost'].includes(c.status)).length;const unpaid=db.invoices.filter(i=>i.status==='Unpaid').reduce((a,b)=>a+(+b.total||0),0);return `<div class="hero"><div class="hero-main"><div class="eyebrow">✦ YOUR LAUNCHPAD IS READY</div><h1>Build something<br/><em>worth buying.</em></h1><p>Turn a skill into a sellable offer, share a beautiful page, and manage every customer in one place. No coding. No monthly fee for this offline tool.</p><div class="hero-cta"><button class="btn" onclick="navigate('studio')">Build your first offer ${icon('arrow')}</button><button class="btn btn-ghost" onclick="navigate('growth')">Explore business ideas</button></div></div><div class="hero-aside"><div class="orbit"><div class="star">✳</div></div><div><div class="eyebrow">THE FOUR-STEP LOOP</div><div class="aside-steps"><div><span class="num">01</span> Create an offer</div><div><span class="num">02</span> Share your page</div><div><span class="num">03</span> Close a client</div><div><span class="num">04</span> Deliver and repeat</div></div></div></div></div><div class="stat-grid">${stat('Offers live',db.offers.length,'Your sellable services','↗')}${stat('Active prospects',active,'Deals still in progress','◎')}${stat('Revenue recorded',money(paid),'Invoices marked paid','↗')}${stat('Unpaid invoices',money(unpaid),'Waiting to be collected','⌁')}</div><div class="grid2"><section class="panel"><div class="panel-head"><h3>Recent offers</h3><button class="btn-inline" onclick="navigate('studio')">View studio ↗</button></div>${db.offers.length?db.offers.slice(-4).reverse().map(o=>`<div class="flow-item"><div class="flow-icon">${icon('bolt')}</div><div class="grow"><strong>${esc(o.title)}</strong><p>${esc(trunc(o.description,54))}</p></div><div class="money">${currencyMoney(o.price,o.currency)}</div></div>`).join(''):empty('✦','Your first offer starts here','Package something you can do for someone and give it a price.','navigate(\'studio\')','Create offer')}</section><section class="panel"><div class="panel-head"><h3>Activity</h3><span class="tiny">Recorded on this device</span></div>${db.activity.length?db.activity.slice(0,5).map(a=>`<div class="recent-row"><strong>${esc(a.title)}</strong><span>${datetime(a.time)}</span></div>`).join(''):empty('◎','A fresh start','Your launches, clients, and invoices will appear here.')}${!db.offers.length&&!db.clients.length?`<div style="height:14px"></div><button class="btn btn-ghost btn-small" onclick="loadDemo()">Explore with sample data</button>`:''}</section></div>`}
function offerCard(o){return `<article class="offer-card"><div class="row"><span class="tag good">● Ready to share</span><span class="money">${currencyMoney(o.price,o.currency)}</span></div><h3>${esc(o.title)}</h3><p>${esc(trunc(o.description,123))}</p><div class="tiny">${esc(o.category)} · ${esc(o.delivery||'Custom')} delivery</div><div class="offer-actions"><button class="btn btn-small" onclick="shareOffer('${o.id}')">${icon('link')} Share</button><button class="btn btn-ghost btn-small" onclick="editOffer('${o.id}')">${icon('edit')} Edit</button><button class="btn btn-danger btn-small" onclick="deleteOffer('${o.id}')">${icon('trash')}</button></div></article>`}
function studio(){let o=editingOffer?db.offers.find(x=>x.id===editingOffer):null;return `<div class="section-header"><div><div class="eyebrow">01 / YOUR STOREFRONT</div><h2>Launch a service in minutes.</h2><p class="muted">Your page comes with a customer contact button and optional checkout link.</p></div></div><div class="split"><div class="panel"><div class="panel-head"><h3>${o?'Edit your offer':'Create an offer'}</h3><span class="tag neutral">No code</span></div><form class="form" id="offer-form"><div class="field"><label for="offer-title">What are you selling? *</label><input id="offer-title" name="title" maxlength="80" required placeholder="e.g. High-converting business website" value="${esc(o?.title||'')}" /></div><div class="field"><label for="offer-desc">Explain the value *</label><textarea id="offer-desc" name="description" maxlength="400" required placeholder="I create modern, mobile-friendly websites that help businesses attract new customers.">${esc(o?.description||'')}</textarea></div><div class="form-row"><div class="field"><label for="offer-price">Price *</label><input id="offer-price" name="price" type="number" min="1" max="99999999999" step="0.01" required placeholder="25000" value="${esc(o?.price||'')}" /></div><div class="field"><label for="offer-category">Category</label><select id="offer-category" name="category">${['Web design','Video editing','Graphic design','Marketing','Writing','Tutoring','Consulting','Other'].map(c=>`<option ${o?.category===c?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="form-row"><div class="field"><label for="offer-delivery">Delivery time</label><input id="offer-delivery" name="delivery" maxlength="35" value="${esc(o?.delivery||'3 days')}" placeholder="3 days" /></div><div class="field"><label for="offer-phone">WhatsApp number *</label><input id="offer-phone" name="phone" type="tel" required maxlength="20" value="${esc(o?.phone||db.settings.phone)}" placeholder="2348012345678" /><div class="field-help">Country code, no + or spaces (e.g. 234...).</div></div></div><div class="field"><label for="offer-pay">Payment URL (optional)</label><input id="offer-pay" name="payment" type="url" maxlength="600" placeholder="https://your-payment-link.com" value="${esc(o?.payment||db.settings.payment)}"/><div class="field-help">Only add a payment link you created and trust. No payments processed by ASD Forge.</div></div><div class="form-actions"><span class="tiny">No sign-up required. Saved to this device.</span><div style="display:flex;gap:7px">${o?`<button type="button" class="btn btn-ghost" onclick="cancelOfferEdit()">Cancel</button>`:''}<button class="btn" type="submit">${o?'Save changes':'Publish offer'} ${icon('arrow')}</button></div></div></form></div><div class="preview-wrap"><div class="panel"><div class="panel-head"><h3>Live page preview</h3><span class="tag neutral">Preview</span></div><div class="preview" id="offer-preview"></div><p class="tiny" style="margin:14px 0 0">Once saved, use Share to copy a link. The link works on any device after you publish this app to a website host.</p></div></div></div><div class="section-spacer"></div><div class="section-header"><div><h2>Your offers <span class="tiny">(${db.offers.length})</span></h2><p class="muted">Each offer gets its own shareable mini sales page.</p></div></div>${db.offers.length?`<div class="offer-grid">${db.offers.slice().reverse().map(offerCard).join('')}</div>`:empty('✦','Nothing published yet','Complete the form above to make your first sellable offer.')}`}
function previewOffer(){let get=n=>document.getElementById(n)?.value||'';let el=document.getElementById('offer-preview');if(!el)return;el.innerHTML=`<div class="preview-cover"><div class="preview-orb">✳</div></div><div class="preview-inner"><div class="logo-mini">${esc(db.settings.name).toUpperCase()}</div><div class="tiny" style="margin-top:15px">${esc(get('offer-category')||'Your service')}</div><h3>${esc(get('offer-title')||'Your amazing service')}</h3><div class="muted small" style="min-height:50px;overflow-wrap:anywhere">${esc(trunc(get('offer-desc')||'Tell people what you do and why it matters.',140))}</div><div class="price">${money(get('offer-price')||0)}</div><div class="solid-demo">Get started ↗</div><div class="not-live">Preview only</div></div>`}
function bindForms(){let of=document.getElementById('offer-form');if(of){of.addEventListener('input',previewOffer);of.addEventListener('submit',saveOffer);previewOffer()}let cf=document.getElementById('client-form');if(cf)cf.addEventListener('submit',saveClient);let inf=document.getElementById('invoice-form');if(inf)inf.addEventListener('submit',saveInvoice);let sf=document.getElementById('settings-form');if(sf)sf.addEventListener('submit',saveSettings);let idea=document.getElementById('pitch-form');if(idea)idea.addEventListener('submit',pitchGenerate)}
function saveOffer(e){e.preventDefault();let f=new FormData(e.currentTarget);let phone=String(f.get('phone')||'').replace(/\D/g,'');if(phone.length<7||phone.length>15){toast('Enter a valid WhatsApp number with country code');return}let item={id:editingOffer||id(),title:String(f.get('title')).trim(),description:String(f.get('description')).trim(),price:Number(f.get('price')),currency:db.settings.currency,category:String(f.get('category')),delivery:String(f.get('delivery')).trim(),phone,payment:String(f.get('payment')).trim(),created:Date.now()};if(!item.title||!item.description||item.price<=0){toast('Please complete the required fields');return}let idx=db.offers.findIndex(o=>o.id===item.id);if(idx!==-1){item.created=db.offers[idx].created;db.offers[idx]=item}else db.offers.push(item);log(idx===-1?`Published ${item.title}`:`Updated ${item.title}`);persist();editingOffer=null;render();toast('Your offer is ready. Tap Share to copy the sales link.');document.querySelector('.offer-grid')?.scrollIntoView({behavior:'smooth',block:'start'})}
function editOffer(i){editingOffer=i;page='studio';render();document.getElementById('offer-form')?.scrollIntoView({behavior:'smooth'})}
function cancelOfferEdit(){editingOffer=null;render()}
function deleteOffer(i){if(!confirm('Delete this offer from your local workspace? Previously shared links can still open their saved page.'))return;db.offers=db.offers.filter(o=>o.id!==i);if(editingOffer===i)editingOffer=null;persist();render();toast('Offer deleted')}
function safeURL(url){try{let u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:''}catch(e){return ''}}
function encodeOffer(o){let data={v:1,brand:db.settings.name,tag:db.settings.tagline,title:o.title,description:o.description,price:o.price,currency:o.currency,category:o.category,delivery:o.delivery,phone:o.phone,payment:safeURL(o.payment)};let bytes=new TextEncoder().encode(JSON.stringify(data));return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decodeOffer(hash){try{let s=hash.slice('#offer='.length).replace(/-/g,'+').replace(/_/g,'/');const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));let o=JSON.parse(new TextDecoder().decode(bytes));if(o.v!==1||!o.title||!o.phone||!o.price)return null;return o}catch(e){return null}}
function shareOffer(i){let o=db.offers.find(o=>o.id===i);if(!o)return;const link=location.href.split('#')[0]+'#offer='+encodeOffer(o);copy(link);if(location.protocol==='file:')toast('Link copied. Publish index.html online before sending to customers.');else toast('Shareable sales page link copied!')}
async function copy(s){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(s);return}let e=document.createElement('textarea');e.value=s;e.style.cssText='position:fixed;left:-9999px';document.body.append(e);e.select();document.execCommand('copy');e.remove()}catch(e){prompt('Copy this:',s)}}
function renderPublic(){const data=decodeOffer(location.hash);document.title=data?`${data.title} — ${data.brand}`:'Offer not found — ASD Forge';const ph=data?String(data.phone).replace(/\D/g,''):'';const wa=ph.length>=7&&ph.length<=15?`https://wa.me/${ph}?text=${encodeURIComponent(`Hi! I'm interested in ${data.title} (${currencyMoney(data.price,data.currency)}). Please tell me how to get started.`)}`:'';let pay=data?safeURL(data.payment):'';document.getElementById('app').innerHTML=data?`<div class="public-body"><article class="public-card"><div class="public-head"><div class="public-symbol">✳</div></div><div class="public-inner"><div class="eyebrow">${esc(data.brand||'INDEPENDENT CREATOR')}</div><div class="tiny">${esc(data.category||'Professional service')}</div><h1>${esc(data.title)}</h1><div class="price">${currencyMoney(data.price,data.currency)}</div><p class="public-desc">${esc(data.description)}</p><div class="public-info"><span class="tag neutral">✦ Delivery: ${esc(data.delivery||'By arrangement')}</span><span class="tag good">✓ Direct WhatsApp inquiry</span></div><div class="public-actions"><a class="btn" href="${wa}" rel="noopener noreferrer" target="_blank">Message to order ↗</a>${pay?`<a class="btn btn-ghost" href="${esc(pay)}" target="_blank" rel="noopener noreferrer">Open payment link ↗</a>`:''}</div><div class="public-foot">Provided by <b>${esc(data.brand||'Independent seller')}</b>. Confirm delivery and payment details with the seller before paying. Site tools by ASD Forge.</div></div></article></div>`:`<div class="public-body"><div class="panel" style="max-width:420px;text-align:center"><h2>Offer not found</h2><p class="muted">This link is invalid or incomplete.</p><a class="btn" href="${location.href.split('#')[0]}">Open ASD Forge</a></div></div>`;document.getElementById('overlay').innerHTML=''}
function statusTag(s){return `<span class="tag ${s==='Won'||s==='Paid'?'good':s==='Lost'?'bad':'neutral'}">${esc(s)}</span>`}
function clients(){const counts=['All','New','Contacted','Negotiating','Won','Lost'];let list=db.clients.filter(x=>filter==='All'||x.status===filter);return `<div class="section-header"><div><div class="eyebrow">02 / CUSTOMER RELATIONSHIPS</div><h2>Every lead deserves a follow-up.</h2><p class="muted">Track conversations manually. Client details stay in this browser.</p></div><button class="btn" onclick="showClientModal()">${icon('plus')} Add client</button></div><section class="panel"><div class="control-line" style="margin-bottom:20px"><div class="filters">${counts.map(s=>`<button class="pill ${filter===s?'on':''}" onclick="setFilter('${s}')">${s}${s==='All'?' ('+db.clients.length+')':''}</button>`).join('')}</div></div>${list.length?`<div class="table-scroll"><table><thead><tr><th>Client</th><th>Offer / need</th><th>Potential value</th><th>Status</th><th>Action</th></tr></thead><tbody>${list.map(c=>`<tr><td><strong>${esc(c.name)}</strong><small>${esc(c.phone||'No contact')}</small></td><td>${esc(c.service||'General inquiry')}</td><td>${money(c.value)}</td><td>${statusTag(c.status)}</td><td class="actions"><button class="btn btn-ghost btn-small" onclick="showClientModal('${c.id}')">Edit</button>${c.phone?`<button class="btn btn-soft btn-small" onclick="contactClient('${c.id}')">WhatsApp</button>`:''}<button class="btn btn-danger btn-small" onclick="removeClient('${c.id}')" aria-label="Delete client">×</button></td></tr>`).join('')}</tbody></table></div>`:empty('◎',db.clients.length?'No clients in this stage':'Your pipeline is empty','Add your first lead after someone messages you.','showClientModal()','Add first client')}</section>`}
function setFilter(s){filter=s;render()}
function showClientModal(i=''){let c=db.clients.find(x=>x.id===i)||{};document.getElementById('overlay').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="Client editor"><div class="modal-header"><h2>${i?'Edit client':'New client'}</h2><button class="x" onclick="closeModal()" aria-label="Close">×</button></div><form id="client-form" class="form"><input type="hidden" name="id" value="${esc(i)}"/><div class="form-row"><div class="field"><label>Name *</label><input name="name" required maxlength="100" value="${esc(c.name||'')}" placeholder="Client name" /></div><div class="field"><label>WhatsApp number</label><input name="phone" maxlength="22" value="${esc(c.phone||'')}" placeholder="23480..."/></div></div><div class="field"><label>What do they need?</label><input name="service" maxlength="120" value="${esc(c.service||'')}" placeholder="Business website" /></div><div class="form-row"><div class="field"><label>Deal value (${db.settings.currency})</label><input name="value" type="number" min="0" step="0.01" value="${esc(c.value||0)}"/></div><div class="field"><label>Pipeline stage</label><select name="status">${['New','Contacted','Negotiating','Won','Lost'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="field"><label>Notes</label><textarea name="notes" maxlength="1000" placeholder="Follow up on Friday...">${esc(c.notes||'')}</textarea></div><button class="btn" type="submit">Save client ${icon('check')}</button></form></section></div>`;document.getElementById('client-form').addEventListener('submit',saveClient)}
function closeModal(){document.getElementById('overlay').innerHTML=''}
function saveClient(e){e.preventDefault();let f=new FormData(e.currentTarget),cid=String(f.get('id')),c={id:cid||id(),name:String(f.get('name')).trim(),phone:String(f.get('phone')).replace(/[^\d]/g,''),service:String(f.get('service')).trim(),value:Number(f.get('value'))||0,status:String(f.get('status')),notes:String(f.get('notes')).trim(),created:Date.now()};if(!c.name)return toast('Enter a client name');let i=db.clients.findIndex(x=>x.id===c.id);if(i!==-1){c.created=db.clients[i].created;db.clients[i]=c}else db.clients.push(c);log(`${i!==-1?'Updated':'Added'} client: ${c.name}`);persist();closeModal();render();toast('Client saved')}
function removeClient(i){if(!confirm('Delete this client? Invoices remain unchanged.'))return;db.clients=db.clients.filter(c=>c.id!==i);persist();render();toast('Client deleted')}
function contactClient(i){let c=db.clients.find(x=>x.id===i);if(!c)return;window.open(`https://wa.me/${encodeURIComponent(c.phone)}?text=${encodeURIComponent(`Hi ${c.name}, I'm following up about ${c.service||'your inquiry'}.`)}`,'_blank','noopener,noreferrer')}
function invoices(){let total=db.invoices.filter(i=>i.status==='Unpaid').reduce((a,b)=>a+b.total,0);return `<div class="section-header"><div><div class="eyebrow">03 / GET PAID</div><h2>Professional invoices. No fuss.</h2><p class="muted">Create a printable invoice, mark payments manually, and export as PDF using Print.</p></div><button class="btn" onclick="showInvoiceModal()">${icon('plus')} New invoice</button></div><div class="notice" style="margin-bottom:16px">Payment status is updated by you. ASD Forge cannot verify whether a customer has paid.</div><section class="panel"><div class="panel-head"><h3>Invoices (${db.invoices.length})</h3><span class="tag">${money(total)} outstanding</span></div>${db.invoices.length?`<div class="table-scroll"><table><thead><tr><th>Invoice</th><th>Client</th><th>Amount</th><th>Due</th><th>Status</th><th>Actions</th></tr></thead><tbody>${db.invoices.slice().reverse().map(inv=>`<tr><td><strong>${esc(inv.number)}</strong><small>${datetime(inv.issued)}</small></td><td>${esc(inv.client)}</td><td class="money">${money(inv.total)}</td><td>${esc(inv.due)}</td><td>${statusTag(inv.status)}</td><td class="actions"><button class="btn btn-ghost btn-small" onclick="printInvoice('${inv.id}')">Print/PDF</button><button class="btn btn-soft btn-small" onclick="togglePaid('${inv.id}')">${inv.status==='Paid'?'Unmark':'Mark paid'}</button><button class="btn btn-danger btn-small" onclick="deleteInvoice('${inv.id}')">×</button></td></tr>`).join('')}</tbody></table></div>`:empty('▤','No invoices yet','Send a professional invoice as soon as a client agrees to buy.','showInvoiceModal()','Create invoice')}</section>`}
function showInvoiceModal(){let next='ASD-'+String(db.invoices.length+1).padStart(4,'0');let due=new Date(Date.now()+7*86400000).toISOString().slice(0,10);document.getElementById('overlay').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="New invoice"><div class="modal-header"><h2>Create invoice</h2><button class="x" onclick="closeModal()">×</button></div><form class="form" id="invoice-form"><div class="field"><label>Business name</label><input readonly value="${esc(db.settings.name)}"/></div><div class="form-row"><div class="field"><label>Invoice number *</label><input name="number" maxlength="36" value="${next}" required/></div><div class="field"><label>Due date *</label><input name="due" type="date" value="${due}" required/></div></div><div class="field"><label>Client's name *</label><input name="client" required maxlength="120" list="known-clients" placeholder="Client name"/><datalist id="known-clients">${db.clients.map(c=>`<option value="${esc(c.name)}"></option>`).join('')}</datalist></div><div class="field"><label>Service / item *</label><input name="item" required maxlength="200" placeholder="Website design package"/></div><div class="form-row"><div class="field"><label>Quantity *</label><input type="number" name="qty" min="1" max="10000" step="1" value="1" required/></div><div class="field"><label>Price per item (${db.settings.currency}) *</label><input type="number" name="unit" min="0.01" step="0.01" required placeholder="25000"/></div></div><div class="field"><label>Payment instructions (optional)</label><textarea name="notes" maxlength="1000" placeholder="Send payment to... or open the payment link in our conversation."></textarea></div><button class="btn" type="submit">Save invoice ${icon('check')}</button></form></section></div>`;document.getElementById('invoice-form').addEventListener('submit',saveInvoice)}
function saveInvoice(e){e.preventDefault();let f=new FormData(e.currentTarget),qty=Number(f.get('qty')),unit=Number(f.get('unit'));if(!(qty>0&&unit>0))return toast('Enter a valid quantity and price');let inv={id:id(),number:String(f.get('number')).trim(),client:String(f.get('client')).trim(),item:String(f.get('item')).trim(),qty,unit,total:Math.round(qty*unit*100)/100,due:String(f.get('due')),notes:String(f.get('notes')),issued:Date.now(),status:'Unpaid',business:db.settings.name,email:db.settings.email,phone:db.settings.phone,currency:db.settings.currency};if(db.invoices.some(x=>x.number===inv.number))return toast('Invoice number already exists');db.invoices.push(inv);log(`Created invoice ${inv.number}`);persist();closeModal();render();toast('Invoice saved. Use Print/PDF to send it.')}
function togglePaid(i){let v=db.invoices.find(x=>x.id===i);if(v){v.status=v.status==='Paid'?'Unpaid':'Paid';log(`${v.number}: ${v.status}`);persist();render();toast('Status updated')}}
function deleteInvoice(i){if(!confirm('Delete this invoice?'))return;db.invoices=db.invoices.filter(x=>x.id!==i);persist();render();toast('Invoice deleted')}
function printInvoice(i){let v=db.invoices.find(x=>x.id===i);if(!v)return;document.getElementById('print-area').innerHTML=`<div class="invoice-sheet"><div class="invoice-head"><div><h1>INVOICE</h1><strong>${esc(v.business)}</strong><p class="muted">${esc(v.email||'')}<br/>${esc(v.phone||'')}</p></div><div><strong>${esc(v.number)}</strong><p class="muted">Issued: ${datetime(v.issued)}<br/>Due: ${esc(v.due)}<br/>Status: ${esc(v.status)}</p></div></div><div style="margin-top:24px"><span class="muted">BILL TO</span><h2 style="font-size:1.4rem;margin-top:5px">${esc(v.client)}</h2></div><table style="margin-top:30px"><thead><tr><th>DESCRIPTION</th><th>QTY</th><th>UNIT PRICE</th><th>TOTAL</th></tr></thead><tbody><tr><td>${esc(v.item)}</td><td>${v.qty}</td><td>${currencyMoney(v.unit,v.currency)}</td><td>${currencyMoney(v.total,v.currency)}</td></tr></tbody></table><div class="invoice-total">Total: ${currencyMoney(v.total,v.currency)}</div>${v.notes?`<div class="invoice-footer"><strong>Payment / delivery notes</strong><p style="white-space:pre-wrap">${esc(v.notes)}</p></div>`:''}<div class="invoice-footer">Thank you for your business.</div></div>`;document.getElementById('print-area').classList.remove('hidden');window.print();setTimeout(()=>document.getElementById('print-area').classList.add('hidden'),1000)}
const IDEAS=[['💻','Simple business websites','Create mobile-friendly pages for small businesses.','Web design'],['🎥','Short video edits','Turn raw clips into polished social media videos.','Video editing'],['✏️','Brand identity kits','Design logos, color palettes, and social media banners.','Graphic design'],['📱','Social media management','Plan and publish helpful content for local brands.','Marketing'],['📚','Online tutoring','Teach a subject you understand through video calls.','Tutoring'],['📃','Copywriting packages','Write product descriptions and landing page copy.','Writing'],['🛒','Store setup service','Set up online catalogs for micro-businesses.','Web design'],['📊','Spreadsheet cleanup','Organize messy business records and reports.','Consulting'],['🎮','Gaming clip edits','Deliver highlight reels and short gaming montages.','Video editing']];
function growth(){return `<div class="section-header"><div><div class="eyebrow">04 / GET YOUR FIRST CUSTOMERS</div><h2>Good businesses solve real problems.</h2><p class="muted">Start with a service you can reliably deliver. Don't promise outcomes you can't control.</p></div></div><div class="panel" style="margin-bottom:20px"><div class="panel-head"><h3>Business idea starter kit</h3><span class="tag">Low overhead</span></div><div class="idea-grid">${IDEAS.map(i=>`<div class="idea"><div class="emoji">${i[0]}</div><strong>${esc(i[1])}</strong><p>${esc(i[2])}</p><button onclick="ideaToOffer('${esc(i[1])}','${esc(i[3])}')">Build this offer →</button></div>`).join('')}</div></div><div class="split"><section class="panel"><div class="panel-head"><h3>Sales message maker</h3><span class="tag neutral">Template-based</span></div><form class="form" id="pitch-form"><div class="field"><label>Choose an offer</label><select name="offer" required><option value="">Pick your offer</option>${db.offers.map(o=>`<option value="${o.id}">${esc(o.title)}</option>`).join('')}</select></div><div class="field"><label>Who are you contacting?</label><select name="audience"><option value="small business owner">Small business owner</option><option value="content creator">Content creator</option><option value="potential customer">Potential customer</option></select></div><button type="submit" class="btn">Generate outreach messages ${icon('spark')}</button></form><div id="pitch-results" class="stack" style="margin-top:19px"></div></section><section class="panel"><div class="panel-head"><h3>The first 7 days</h3><span class="tag">Action plan</span></div>${[['Day 1','Create an offer people understand in 10 seconds.'],['Day 2','Publish your app and share one public offer link.'],['Day 3','Make a small portfolio sample.'],['Day 4','Personally contact 10 suitable potential clients.'],['Day 5','Follow up respectfully and answer questions.'],['Day 6','Deliver quality work for any client you close.'],['Day 7','Review results and adjust your offer.']].map(([day,v])=>`<div class="flow-item"><div class="flow-icon">${icon('check')}</div><div class="grow"><strong>${day}</strong><p>${v}</p></div></div>`).join('')}</section></div>`}
function ideaToOffer(title,category){page='studio';editingOffer=null;render();let inp=document.getElementById('offer-title');inp.value=title;document.getElementById('offer-category').value=category;document.getElementById('offer-desc').value=`I help clients with ${title.toLowerCase()} by providing clear communication, careful work, and dependable delivery.`;previewOffer();window.scrollTo({top:0,behavior:'smooth'})}
function pitchGenerate(e){e.preventDefault();let f=new FormData(e.currentTarget),o=db.offers.find(x=>x.id===f.get('offer'));if(!o)return toast('Create and select an offer first');let aud=String(f.get('audience'));let p1=`Hi! I work with ${aud}s and help them through ${o.title.toLowerCase()}. My service costs ${currencyMoney(o.price,o.currency)} and typically takes ${o.delivery||'a few days'}. Would you like a quick overview?`;let p2=`Hi, just checking back about ${o.title.toLowerCase()}. If the timing isn't right, no worries. Happy to answer any questions.`;let p3=`Hi, thanks for your interest in ${o.title}. Before we start, I can confirm the scope, delivery time, and final price so everything is clear.`;document.getElementById('pitch-results').innerHTML=[["First introduction",p1],["Friendly follow-up",p2],["Closing the sale",p3]].map(([title,p])=>`<div class="template-card"><h3>${title}</h3><div class="template-text">${esc(p)}</div><button class="btn btn-ghost btn-small" type="button" onclick="copyPitch('${title}')">${icon('copy')} Copy message</button></div>`).join('');window.__pitches={'First introduction':p1,'Friendly follow-up':p2,'Closing the sale':p3}}
function copyPitch(k){copy(window.__pitches?.[k]||'');toast('Message copied')}
function settings(){let s=db.settings;return `<div class="section-header"><div><div class="eyebrow">05 / CONFIGURE YOUR BUSINESS</div><h2>Your business, your rules.</h2><p class="muted">These details appear in offer links and invoices you create after saving.</p></div></div><div class="split"><section class="panel"><div class="panel-head"><h3>Business profile</h3><span class="tag neutral">Editable</span></div><form class="form" id="settings-form"><div class="field"><label>Business name *</label><input name="name" maxlength="70" value="${esc(s.name)}" required/></div><div class="field"><label>Short tagline</label><input name="tagline" maxlength="100" value="${esc(s.tagline)}"/></div><div class="form-row"><div class="field"><label>WhatsApp (with country code)</label><input name="phone" maxlength="22" value="${esc(s.phone)}" placeholder="234..." /></div><div class="field"><label>Email address</label><input name="email" type="email" maxlength="160" value="${esc(s.email)}" placeholder="hello@example.com" /></div></div><div class="field"><label>Default currency</label><select name="currency">${Object.keys(CURRENCIES).map(c=>`<option ${s.currency===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Default payment link (optional)</label><input name="payment" type="url" maxlength="600" value="${esc(s.payment)}" placeholder="https://..."/></div><button class="btn" type="submit">Save settings ${icon('check')}</button></form></section><div class="stack"><section class="panel"><div class="panel-head"><h3>Back up your work</h3></div><p class="muted small">Your data exists only in this browser. Export a backup before switching devices or clearing browser data.</p><div class="stack"><button class="btn btn-ghost" onclick="exportData()">${icon('download')} Export all data (.json)</button><label class="btn btn-ghost" style="cursor:pointer">${icon('plus')} Import data backup <input id="import-file" type="file" accept=".json,application/json" hidden onchange="importData(event)"/></label></div></section><section class="panel"><h3>Honest limitations</h3><p class="muted small">ASD Forge does not store data in the cloud, send messages automatically, track link visitors, or collect card payments. It works without an account and is designed as a launch-ready starter tool.</p><div class="notice info">To let customers open your links, host <b>index.html</b> on a public HTTPS website. Your saved workspace will remain local to the device where you created it.</div></section><section class="panel"><div class="control-line"><div><h3 style="margin-bottom:4px">Try sample business data</h3><p class="tiny" style="margin:0">Adds demo offers and clients, never replaces your existing data.</p></div><button class="btn btn-ghost btn-small" onclick="loadDemo()">Add demo</button></div></section></div></div>`}
function saveSettings(e){e.preventDefault();let f=new FormData(e.currentTarget);let pay=String(f.get('payment'));if(pay&&!safeURL(pay))return toast('Enter a valid http(s) payment URL');db.settings={name:String(f.get('name')).trim(),tagline:String(f.get('tagline')).trim(),phone:String(f.get('phone')).replace(/\D/g,''),email:String(f.get('email')).trim(),currency:String(f.get('currency')),payment:pay};if(!db.settings.name)return toast('Enter a business name');log('Updated business profile');persist();render();toast('Profile saved')}
function exportData(){let blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='asd-forge-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup downloaded')}
async function importData(e){let f=e.target.files?.[0];if(!f)return;try{if(f.size>2e6)throw Error('Backup too large');let d=JSON.parse(await f.text());if(!d.settings||!Array.isArray(d.offers)||!Array.isArray(d.clients)||!Array.isArray(d.invoices)||d.offers.length>1000||d.clients.length>10000)throw Error('Invalid backup file');if(!confirm('Replace all local ASD Forge data with this backup?'))return;db={...structuredClone(DEFAULT),...d,settings:{...DEFAULT.settings,...d.settings}};persist();render();toast('Backup restored')}catch(err){toast('Import failed: '+err.message)}}
function loadDemo(){if(!confirm('Add demo offers, client leads, and an invoice to this workspace?'))return;let demo=[{title:'Small business website',description:'A modern, mobile-friendly one-page website for your business, including contact links and clear service information.',price:45000,category:'Web design',delivery:'4 days'},{title:'Gaming montage edit',description:'Turn raw gameplay footage into a sharp highlight reel optimized for social media, complete with transitions and music sync.',price:10000,category:'Video editing',delivery:'2 days'}];db.offers.push(...demo.map(o=>({...o,id:id(),currency:db.settings.currency,phone:db.settings.phone||'2348012345678',payment:'',created:Date.now()})));db.clients.push({id:id(),name:'Demo Cafe',phone:'',service:'Small business website',value:45000,status:'Contacted',created:Date.now(),notes:'Demo record only'});db.invoices.push({id:id(),number:'DEMO-'+Date.now().toString().slice(-4),client:'Example Client',item:'Brand artwork',qty:1,unit:8000,total:8000,issued:Date.now(),due:today(),status:'Unpaid',business:db.settings.name,currency:db.settings.currency,notes:'Sample invoice — not a real sale',phone:'',email:''});log('Added sample records');persist();render();toast('Sample data added — replace it with real work before sharing!')}
const views={overview,studio,clients,invoices,growth,settings};
window.addEventListener('hashchange',()=>render());window.addEventListener('storage',e=>{if(e.key===KEY){db=load();render()}});render();
</script>
