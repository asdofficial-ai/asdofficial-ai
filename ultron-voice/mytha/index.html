.field-note{display:block;font-weight:400;color:#a99aad;font-size:11px;line-height:1.5;margin:5px 0 12px}
.scenario-box{background:#221228;border:1px solid #a14f93;border-radius:16px;padding:14px;margin:12px 0}.scenario-box .field:last-child{margin-bottom:0}
.editor-action-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0}.editor-action-row button{min-height:46px}
.v3-badge{display:inline-flex;align-items:center;border:1px solid #a35f93;background:#481938;border-radius:22px;padding:5px 10px;color:#ffbce3;font-size:11px;font-weight:800}
.v3-preview-switch{display:flex;gap:9px;margin:12px 0}.v3-preview-switch button{flex:1}
.v3-feed-card{height:245px;border-radius:19px;overflow:hidden;position:relative;background:radial-gradient(circle at 60% 25%,#73326f,#15101e 85%);border:1px solid #50394e}.v3-feed-card img{width:100%;height:100%;object-fit:cover}.v3-feed-overlay{position:absolute;bottom:0;left:0;right:0;padding:17px;background:linear-gradient(transparent,#08040fed 60%)}.v3-feed-overlay strong{display:block;font-size:21px}.v3-feed-overlay p{margin:5px 0;color:#e4cfdc;font-size:12px}
.v3-chat-preview{border-radius:15px;border:1px solid #413349;background:#1b1426;overflow:hidden}.v3-chat-preview-top{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #383042}.v3-chat-preview-top img{height:35px;width:35px;object-fit:cover;border-radius:50%}.v3-chat-preview-body{min-height:170px;padding:15px;font-size:13px;line-height:1.65;background:radial-gradient(circle at top right,#4b24464b,transparent 68%)}.v3-chat-preview-bubble{background:#2d2339;border-radius:16px 16px 16px 4px;padding:14px}
.preview-small{font-size:11px;color:#a99ab5}.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 17px}.check-chip{border:1px solid #473747;background:#1b1629;padding:11px;border-radius:12px;font-size:12px;font-weight:600}.check-chip input{accent-color:#ef4eab}
.no-ads-disclosure{font-size:11px;line-height:1.5;color:#b1a4bc}
</style>

<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
/* MYTHA — mobile-first creator-directed AI roleplay prototype. No dependencies. */
(() => {
  'use strict';
  const KEY = 'mytha-v2-state';
  const SESSION_KEY = 'mytha-v2-session';
  const COST = 2;
  const PACKS = [{coins:30,usd:0.99},{coins:80,usd:1.99},{coins:250,usd:4.99}];
  const builtins = [
    {id:'rosemont',name:'Rosemont Academy',author:'MYTHA Studio',genre:'School Life',emoji:'🏛️',glow:'#f58ab5',shade:'#5e305f',short:'An unfamiliar academy. Secret rivalries. Your choices change everything.',description:'A prestigious boarding academy filled with mystery, friendships, secrets, and rivalries. Build your own path while navigating an unusual new environment.',character:'An expressive ensemble narrator who vividly plays distinct faculty and adult students. Keep every character recognizable, with their own motives and memory.',world:'Rosemont Academy is a college-level residential academy where all featured students are age 18 or older. Gothic halls, leafy courtyards, dorm rooms and student societies. The protagonist is a new transfer student. School intrigues, mystery and social rivalries drive the story.',rules:'Keep the focus on friendship, mystery, drama, choices and personal agency. Never normalize harassment or lack of consent. Each supporting character has a distinct voice and private goals.',opening:'*The morning air carries the scent of cut grass and old stone. Rosemont Academy’s iron gates stand open.*\n\n*A receptionist notices you entering the main building and looks up from her desk.*\n\n"New transfer? Welcome to Rosemont. Tell me your name and a little about yourself."',style:'cinematic',creativity:'dynamic',suggestions:['I introduce myself calmly.','I ask about the dormitories.','I look around for familiar faces.']},
    {id:'neon',name:'Neon Afterdark',author:'MYTHA Studio',genre:'Sci-Fi',emoji:'🌃',glow:'#8a93ff',shade:'#26284c',short:'A cyberpunk city. A missing memory. One dangerous secret.',description:'A futuristic city where every alley hides a deal and every memory has a price.',character:'Noa, a witty, cautious underground courier. Fast-thinking, sardonic, secretly kind.',world:'Rain-slick neon megacity at midnight. Corporations control memories. The player is handed a stolen encrypted chip by a stranger.',rules:'Offer meaningful dilemmas, intriguing clues, and exciting action without describing graphic gore. React to player choices.',opening:'*Rain slides down the glass roof of the night market. A hooded courier stops in front of you, breathing hard.*\n\n"You don’t know me," *they say, pressing a warm metal chip into your palm,* "but in sixty seconds everyone in this city will."',style:'cinematic',creativity:'surprising',suggestions:['Who are you?','I hide the chip.','I scan the street for danger.']},
    {id:'kingdom',name:'The Last Kingdom',author:'MYTHA Studio',genre:'Fantasy',emoji:'⚔️',glow:'#e6a36b',shade:'#4d2e32',short:'A crumbling kingdom. Ancient magic. A crown nobody wants.',description:'Choices, alliances, a living fantasy world, and a destiny that is not yet written.',character:'Liora, a sharp-tongued royal scout who trusts actions more than titles.',world:'In the kingdom of Veyra, the stars are vanishing. The palace has sent scouts to find an ancient observatory before winter.',rules:'Improvise imaginative locations and companions. Make choices matter; remember promises. Avoid repetitive fantasy clichés.',opening:'*The fortress bell rings thirteen times. That is one more than it should.*\n\n*A cloaked scout pushes through the tavern door and fixes you with a steady gaze.* "Are you the one who can read the stars?"',style:'cinematic',creativity:'surprising',suggestions:['I ask about the thirteenth bell.','I tell her my name.','I follow the scout.']},
    {id:'investigator',name:'Case Zero',author:'MYTHA Studio',genre:'Mystery',emoji:'🔎',glow:'#9ed9cb',shade:'#244247',short:'One anonymous message. Seven suspects. You lead the investigation.',description:'An interactive detective case with clues, contradictions and memorable witnesses.',character:'Detective Ellis, perceptive, dry-humored and skeptical but fair.',world:'A coastal city during a week of heavy fog. A priceless manuscript disappears from a locked archive.',rules:'Present fair, solvable clues and keep a consistent answer. Do not reveal the culprit until the player earns it.',opening:'*The archive’s main door creaks open. A detective in a worn coat holds out a sealed evidence bag.*\n\n"No broken locks. No cameras. And the manuscript vanished at 2:17 a.m. Where do you want to start?"',style:'balanced',creativity:'dynamic',suggestions:['Show me the evidence.','Who had access?','I inspect the locks.']},
    {id:'orbit',name:'Orbit Nine',author:'MYTHA Studio',genre:'Adventure',emoji:'🪐',glow:'#ad95ee',shade:'#3c305b',short:'Lost in space with a crew that knows more than it admits.',description:'Explore far-off worlds and a mystery hidden in a starship’s navigation logs.',character:'Tess, a fearless starship pilot with humor under pressure.',world:'A deep-space research vessel has received a distress signal from a supposedly uninhabited moon.',rules:'Balance cinematic action, warm crew dynamics, exploration and plausible science-fiction stakes.',opening:'*The ship jolts as a red warning flashes across the cockpit.*\n\n"That signal," *your pilot mutters,* "is coming from a moon that isn’t on any chart."',style:'fast',creativity:'dynamic',suggestions:['Set a course for the moon.','What do our scanners show?','I ask the crew for answers.']},
    {id:'cafe',name:'Midnight Café',author:'MYTHA Studio',genre:'Slice of Life',emoji:'☕',glow:'#e7b18e',shade:'#5c353d',short:'A café that only opens when someone needs it.',description:'Gentle conversations, discoveries, and emotionally rich everyday stories.',character:'Ari, a thoughtful late-night barista with understated humor, never judgmental.',world:'A cozy city café that appears on rainy nights when people have something important to figure out.',rules:'Be warm, natural and specific without sounding preachy. Ask questions organically, not at the end of every reply.',opening:'*The bell above the café door rings as the rain grows louder outside. Behind the counter, a barista looks up.*\n\n"Rough night, or just looking for the best coffee in town?"',style:'balanced',creativity:'dynamic',suggestions:['Just coffee, please.','What is this place?','I sit by the window.']}
  ];
  const $ = id => document.getElementById(id);
  const h = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = () => (crypto?.randomUUID?.() || Math.random().toString(36).slice(2)+Date.now().toString(36));
  const pick = a => a[Math.floor(Math.random()*a.length)];
  const load = () => { try { const v=JSON.parse(localStorage.getItem(KEY)); return v&&typeof v==='object'?v:{} } catch{return {}} };
  const s = Object.assign({page:'home',category:'All',search:'',created:[],community:[],chats:{},active:null,credits:40,username:'Story explorer',persona:'',mode:'preview',serverConnected:false,settings:{sound:false,reduceMotion:false},creator:{status:'explorer',previewUnlocked:false,interest:''},editingId:null,editorDraft:null,editorExtra:0,editorImage:'',editorBackground:'',previewTab:'feed',previewFields:null},load());
  if(!s.creator || typeof s.creator!=='object') s.creator={status:'explorer',previewUnlocked:false,interest:''};
  s.serverConnected=false;
  s.editorDraft=null;s.editorExtra=0;s.editorImage='';s.editorBackground='';s.previewFields=null;
  let session = ''; try {session=localStorage.getItem(SESSION_KEY)||''} catch(_) {}
  let modal = '', replyBusy = false, draft = '', noticeTimer;
  const persist = () => {try{localStorage.setItem(KEY,JSON.stringify({...s,page:'home',active:null,search:''}))}catch(e){console.warn('Save not available',e)}};
  const allStories = () => [...builtins,...s.community.filter(x=>!s.created.some(y=>y.submissionId===x.id)),...s.created];
  const storyById = id => allStories().find(x=>x.id===id);
  const icon = (name,size=19) => { const path={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',chats:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 9 9 0 0 1-8.1 5 8.4 8.4 0 0 1-3.8-.9L3 21l1.6-5.2A8.4 8.4 0 0 1 3.7 12a9 9 0 0 1 5-8.1 8.4 8.4 0 0 1 3.8-.9h.5a9 9 0 0 1 8 8z"/>',create:'<path d="M12 5v14M5 12h14"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',back:'<path d="m15 18-6-6 6-6"/>',send:'<path d="m22 2-7 20-4-9-9-4 20-7z"/><path d="M22 2 11 13"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',coin:'<circle cx="12" cy="12" r="9"/><path d="M9 10c0-2 6-2 6 0 0 3-6 1-6 4 0 2 6 2 6 0M12 6v12"/>',menu:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',x:'<path d="M6 6 18 18M18 6 6 18"/>',sparkle:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>',refresh:'<path d="M20 7V3m0 4h-4M4 17v4m0-4h4M5 10a7 7 0 0 1 12-4l3 1M4 17l3 1a7 7 0 0 0 12-4"/>',edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L9 17l-4 1 1-4z"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/>',down:'<path d="m6 9 6 6 6-6"/>',shield:'<path d="M12 22S4 18 4 11V5l8-3 8 3v6c0 7-8 11-8 11z"/>'}[name]||'<circle cx="12" cy="12" r="9"/>';return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg>`};
  const toast = txt => { const el=$('toast');el.textContent=txt;el.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.classList.remove('show'),3200) };
  const btn = (label,action,klass='secondary') => `<button class="${klass}" data-action="${h(action)}">${label}</button>`;
  function topbar(){return `<header class="topbar"><div class="logo">✦</div><span class="wordmark">MYTHA</span><div class="spacer"></div><button class="gold-pill" data-action="wallet" aria-label="Open coin wallet">${icon('coin',15)} <span data-balance>${s.credits}</span> coins</button><button class="avatar-circle" data-action="profile" aria-label="View profile">👤</button></header>`}
  function bottomnav(){return `<nav class="bottomnav" aria-label="Main navigation">${[['home','Discover'],['chats','My chats'],['create','Create'],['profile','Profile']].map(([id,label])=>`<button class="navitem ${s.page===id?'active':''}" data-action="${id}" aria-label="${label}"><span class="nav-icon">${icon(id,22)}</span>${label}</button>`).join('')}</nav>`}
  function card(st){return `<button class="story-card" data-action="open" data-id="${h(st.id)}"><div class="story-illustration" style="--glow:${h(st.glow)};--shade:${h(st.shade)}">${st.avatar&&st.avatar.startsWith("data:image/")?`<img src="${h(st.avatar)}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover">`:`<div class="illustration-glyph">${h(st.emoji)}</div>`}</div><div class="story-info"><h3>${h(st.name)}</h3><p>${h(st.genre)} · by ${h(st.author)}</p></div></button>`}
  function home(){let arr=allStories().filter(x=>(s.category==='All'||x.genre===s.category)&&(x.name+' '+x.genre+' '+x.short+' '+x.author).toLowerCase().includes(s.search.toLowerCase()));return `<div class="content" id="pagecontent"><div class="eyebrow" style="margin-top:12px">THE STORIES ARE YOURS TO SHAPE</div><h1 class="display home-heading">Your world.<br><span class="accent">Your choices.</span></h1><p class="home-sub">Explore creator-made worlds. AI characters respond to what you actually say.</p><label class="searchbox">${icon('search')}<input id="search" aria-label="Search worlds" placeholder="Search stories, worlds, creators..." value="${h(s.search)}" /></label><div class="featured" role="button" tabindex="0" data-action="open" data-id="rosemont"><div class="poster-shape"></div><div class="featured-sheen"></div><div class="featured-body"><span class="tag">✦ FEATURED WORLD</span><h2 class="featured-title">Rosemont Academy</h2><p class="featured-desc">Step through the gates. Secrets and rivalries are waiting. The next chapter is yours.</p><div class="featured-bottom"><div class="rating">🏛️ Mystery · School life</div><span class="primary">Start story →</span></div></div></div><div class="section-head"><span class="section-title">Find your next story</span><button class="seeall" data-action="create">Create yours +</button></div><div class="chips">${['All','Romance','School Life','Fantasy','Sci-Fi','Mystery','Adventure','Slice of Life'].map(c=>`<button class="chip ${s.category===c?'active':''}" data-action="category" data-id="${h(c)}">${h(c)}</button>`).join('')}</div><div class="story-grid" id="storygrid">${arr.length?arr.map(card).join(''):'<div class="no-results">No stories found. Create one of your own!</div>'}</div><div class="notice" style="margin-top:18px">✨ <b>Creator-led, AI-powered.</b> Every world has its own character, setting and rules. The AI improvises the next scene from your choices.</div></div>`}
  function chatsPage(){const entries=Object.entries(s.chats).filter(([id,c])=>!!storyById(c.storyId)).sort((a,b)=>(b[1].updated||0)-(a[1].updated||0));return `<div class="content"><h1 class="display page-title">My chats</h1><p class="page-help">Pick up any of your adventures right where you left off.</p>${entries.length?`<div class="chat-list">${entries.map(([id,c])=>{let x=storyById(c.storyId),last=c.messages.at(-1)?.text||x.short;return `<button class="chat-list-item" data-action="resume" data-id="${h(id)}"><span class="list-icon" style="--glow:${h(x.glow)};--shade:${h(x.shade)}">${h(x.emoji)}</span><span class="list-copy"><b>${h(x.name)}</b><span>${h(last.replace(/\*/g,''))}</span></span><span class="list-meta">${Math.max(0,c.messages.length-1)} msgs</span></button>`}).join('')}</div>`:`<div class="empty"><div class="empty-emoji">💬</div><h2>Every story begins somewhere</h2><p>Start a world and your conversations will appear here automatically.</p>${btn('Explore stories','home','primary')}</div>`}</div>`}
  function creatorGate(){
    const status=s.creator.status||'explorer',pending=status==='pending'||status==='pending_local';
    return `<div class="content"><div class="eyebrow" style="margin-top:18px">BECOME A CREATOR</div><h1 class="display page-title">Your imagination.<br><span class="accent">Your characters.</span></h1><p class="page-help">Everyone starts as an Explorer. Creators design how fictional characters speak, react and guide a story. The full qualification method will be announced by MYTHA's owner.</p>
      <div class="creator-benefits"><div><b>01</b><span>Apply for Creator access</span></div><div><b>02</b><span>Wait for account approval</span></div><div><b>03</b><span>Build characters and submit stories for review</span></div></div>
      <div class="notice">${pending?'🕒 Creator interest recorded. Approval is not automatic.':'✨ Creator applications are being designed. You can register your interest now.'} ${status==='pending_local'?'This request is saved on this browser only; it has not been sent to an admin.':status==='pending'?'Your application is pending review.':'The qualification requirements will be decided later.'}</div>
      ${!pending?`<form id="creatorRequestForm" class="form-panel"><label class="field"><span>What kinds of stories would you create? *</span><textarea name="interest" required maxlength="700" placeholder="Example: Confident, mysterious romance characters with slow-burn relationships and branching stories..."></textarea></label><button class="primary full" type="submit">Register Creator interest</button></form>`:''}
      <div class="creator-sandbox"><div class="sandbox-icon">🧪</div><div><h2>Try the Creator Studio</h2><p>Make and test private characters before the official qualification system launches. Demo mode does <b>not</b> grant Creator access or allow public publishing.</p></div><button class="secondary full" data-action="creatorDemo">Open demo studio →</button></div>
      <button class="secondary full" data-action="home" style="margin-top:12px">Back to Discover</button></div>`;
  }
  const dynamicChoices=(values,current) => values.map(([v,label])=>`<option value="${h(v)}" ${v===current?'selected':''}>${h(label)}</option>`).join('');
  function createPage(){
    if(s.creator.status!=='approved'&&!s.creator.previewUnlocked)return creatorGate();
    const edit=s.created.find(x=>x.id===s.editingId)||null;
    const val=(key,defaultValue='')=>h(s.editorDraft?.[key]??edit?.[key]??defaultValue);
    const choice=(key,items,def)=>dynamicChoices(items,s.editorDraft?.[key]??edit?.[key]??def);
    const canPublish=s.creator.status==='approved'&&s.serverConnected;
    const avatar=s.editorImage||edit?.avatar||'';
    const background=s.editorBackground||edit?.bgImage||'';
    const existingScenarios=edit?.scenarios||[];
    const extraScenarioCount=Math.max(s.editorExtra,existingScenarios.length-1,0);
    const extraScenes=Array.from({length:Math.min(3,extraScenarioCount)},(_,i)=>{const no=i+2;const scene=existingScenarios[i+1]||{};return `<div class="scenario-box"><div class="row" style="justify-content:space-between"><b>Scenario ${no}</b><button type="button" class="icon-btn" data-action="removeScenario" data-id="${no}" aria-label="Remove scenario">${icon('trash',15)}</button></div><label class="field"><span>Scenario title</span><input name="scenario${no}Title" maxlength="60" value="${val(`scenario${no}Title`,scene.title||`Scenario ${no}`)}" /></label><label class="field"><span>Where does this scenario begin?</span><textarea name="scenario${no}World" maxlength="2000">${val(`scenario${no}World`,scene.world||'')}</textarea></label><label class="field"><span>Opening message</span><textarea name="scenario${no}Opening" maxlength="1600">${val(`scenario${no}Opening`,scene.opening||'')}</textarea></label></div>`}).join('');
    const tagsValue=(s.editorDraft?.tags??(edit?.tags||[]).join(', '))||'';
    const emotionsValue=s.editorDraft?.emotions??(edit?.emotionCues||[]).join(',')??'';
    return `<div class="content"><div class="eyebrow" style="margin-top:13px">CREATOR STUDIO ${canPublish?'':'· DEMO SANDBOX'}</div><h1 class="display page-title">${edit?'Edit your world.':'Build a living world.'}</h1><p class="page-help">Set who the character is, how they behave, their relationship style, and what happens when a player responds. ${canPublish?'Submit finished stories to moderation.':'Everything you build here is saved privately on this device.'}</p>
    ${!canPublish?`<div class="notice">🧪 Demo Creator Studio. This is not verified Creator membership. Publishing is locked until real account approval and server connection are available. ${btn('Creator status','creatorStatus','secondary')}</div>`:''}
    <div class="editor-tabs"><button type="button" class="current" aria-current="page">Profile</button><button type="button" data-action="previewCreator">Preview</button></div>
    <form class="form-panel" id="creatorform">
    <div class="form-step">00 · CHARACTER FIGURE & MEDIA</div>
    <div class="upload-shell"><div>${avatar?`<img id="avatarPreview" class="upload-pic" src="${h(avatar)}" alt="Character image preview">`:'<div id="avatarFallback" class="upload-pic fallback">✦</div>'}</div><div class="file-picker"><b>Character photo</b><span class="field-note">Add your own non-explicit character image (JPG, PNG, WebP). Stored only on this device in the demo.</span><input id="avatarUpload" type="file" accept="image/jpeg,image/png,image/webp" aria-label="Choose character image"></div></div>
    <div class="field"><span>Chat background (optional)</span><div class="back-preview">${background?`<img id="backgroundPreview" src="${h(background)}" alt="Chat background">`:'<span id="backgroundFallback">Background preview</span>'}</div><input id="backgroundUpload" type="file" accept="image/jpeg,image/png,image/webp" aria-label="Choose chat background" style="margin-top:9px"></div>
    <p class="field-note">Quick Image Creation and Custom Image Creation will be connected to an image generation service later. Uploaded images work now.</p>
    <div class="form-step">01 · IDENTITY AND STORY</div>
    <label class="field"><span>Story / chat title *</span><input name="name" maxlength="70" required value="${val('name')}" placeholder="A Dangerous Promise" /></label>
    <div class="two-fields"><label class="field"><span>Creator name</span><input name="author" maxlength="35" value="${val('author',s.username)}" /></label><label class="field"><span>Genre</span><select name="genre">${choice('genre',['Romance','School Life','Fantasy','Sci-Fi','Mystery','Adventure','Slice of Life'].map(v=>[v,v]),'Romance')}</select></label></div>
    <label class="field"><span>Character name *</span><input name="characterName" required maxlength="50" value="${val('characterName')}" placeholder="E.g. Zayn or Maren" /></label>
    <div class="two-fields"><label class="field"><span>Age (18+) *</span><input name="age" type="number" min="18" max="120" required value="${val('age','20')}" /></label><label class="field"><span>Gender</span><select name="gender">${choice('gender',[['female','Female'],['male','Male'],['nonbinary','Non-binary'],['self-described','Self-described']], 'female')}</select></label></div>
    <label class="field"><span>Introduction / Bio</span><textarea name="bio" maxlength="500" placeholder="Short description shown on the character card">${val('bio')}</textarea></label>
    <label class="field"><span>Spoken voice</span><select name="spokenVoice">${choice('spokenVoice',[['off','Off'],['gentle','Gentle'],['warm','Warm'],['bright','Bright'],['deep','Deep']], 'gentle')}</select><span class="field-note">Uses your phone's available text-to-speech voices in the demo. Voice cloning and studio-quality voices are not yet enabled.</span></label>
    <label class="field"><span>Character role *</span><input name="characterRole" required maxlength="160" value="${val('characterRole')}" placeholder="Protective rival, mysterious roommate, loyal bodyguard..." /></label>
    <label class="field"><span>Detailed character personality *</span><textarea name="character" maxlength="10000" required placeholder="Their values, flaws, habits, motivations, fears, secrets, mannerisms...">${val('character')}</textarea></label>
    <div class="form-step">02 · BEHAVIOR AND CHEMISTRY</div>

  function modalHTML(){if(!modal)return '';let content='';if(modal==='wallet'){content=`<div class="modal-head"><h2>🪙 Coin wallet</h2><button class="icon-btn" data-action="close" aria-label="Close">${icon('x')}</button></div><div class="wallet-hero"><div class="eyebrow">YOUR BALANCE</div><div class="wallet-number">${s.credits} <span>coins</span></div><p>Every text message costs <b>${COST} coins</b>.</p></div><h3 class="subheading">Affordable coin packs</h3><p class="hint" style="margin-bottom:10px">Prices below are draft USD prices for text chat only. Media and premium AI models may use different rates once integrated.</p><div class="wallet-packs">${PACKS.map(p=>`<button class="pack" data-action="purchase" data-id="${p.coins}"><div><b>🪙 ${p.coins} coins</b><small>${p.coins/COST} messages</small></div><strong>$${p.usd.toFixed(2)}</strong></button>`).join('')}</div><p class="hint">No purchase or subscription checkout is active. This is a pricing preview only; no card will be charged.</p><div class="setting-row"><div><b>MYTHA Plus · planned</b><small>150 coins / month (75 text messages)</small></div><strong>$2.99/mo</strong></div>${s.mode==='preview'?`<button class="secondary full" data-action="demoTopup">Add 20 demo coins (testing only)</button>`:''}`}
    else if(modal==='chatOptions'){content=`<div class="modal-head"><h2>Story options</h2><button class="icon-btn" data-action="close">${icon('x')}</button></div><p>Give your story a new beginning or return to your chats.</p>${btn('Restart this story','restart','secondary full')}${btn('Choose scenario','changeScenario','secondary full')}${btn('View my chats','chats','secondary full')}`}

    else if(modal==='scenarioPicker'){const story=storyById(pendingStoryId);content=`<div class="modal-head"><h2>Choose your scenario</h2><button class="icon-btn" data-action="close">${icon('x')}</button></div><p>Each scenario starts a separate chat with its own opening message.</p><div class="chat-list">${(story?.scenarios||[{title:'Scenario 1',world:story?.world,opening:story?.opening}]).map((sc,i)=>`<button class="chat-list-item" data-action="startScenario" data-id="${i}"><span class="list-icon">${i+1}</span><span class="list-copy"><b>${h(sc.title||`Scenario ${i+1}`)}</b><span>${h((sc.world||'A new scene').slice(0,90))}</span></span></button>`).join('')}</div>`}
    else if(modal==='characterPreview'){const q=s.previewFields||{},name=q.characterName||q.name||'Your character',intro=q.bio||q.short||'Describe your character to see a preview.',opening=q.opening||'Your opening message appears here.';const img=s.editorImage||storyById(s.editingId)?.avatar||'';const bg=s.editorBackground||storyById(s.editingId)?.bgImage||'';content=`<div class="modal-head"><h2>Character preview</h2><button class="icon-btn" data-action="close">${icon('x')}</button></div><p class="preview-small">This preview uses your unsaved form values. No AI is generated or coins charged.</p><div class="v3-preview-switch"><button class="${s.previewTab==='feed'?'primary':'secondary'}" data-action="previewFeed">Feed</button><button class="${s.previewTab==='chat'?'primary':'secondary'}" data-action="previewChat">In Chat</button></div>${s.previewTab==='feed'?`<div class="v3-feed-card">${img?`<img src="${h(img)}" alt="Character image">`:''}<div class="v3-feed-overlay"><span class="v3-badge">${h(q.genre||'Roleplay')}</span><strong>${h(name)}</strong><p>${h(intro)}</p></div></div>`:`<div class="v3-chat-preview"><div class="v3-chat-preview-top">${img?`<img src="${h(img)}" alt="">`:'<span>✦</span>'}<strong>${h(name)}</strong><span class="preview-small"> · Demo preview</span></div><div class="v3-chat-preview-body" ${bg?`style="background-image:linear-gradient(#120e17b8,#120e17dc),url('${h(bg)}');background-size:cover"`:''}><div class="v3-chat-preview-bubble">${formatText(opening)}</div></div></div>`}<button class="secondary full" data-action="close" style="margin-top:14px">Continue editing</button>`}

  let pendingDelete = '', pendingStoryId='';
  function captureEditor(){const f=$('creatorform');if(!f)return;const d=new FormData(f);s.editorDraft=Object.fromEntries(d.entries());s.editorDraft.emotions=d.getAll('emotion').join(',');}
  function safeImages(file,field,imgId,fallbackId){if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>1500000){toast('Choose JPG, PNG or WebP under 1.5 MB');return;}const reader=new FileReader();reader.onload=()=>{if(typeof reader.result!=='string')return;if(field==='avatar')s.editorImage=reader.result;else s.editorBackground=reader.result;const el=$(imgId);if(el&&el.tagName==='IMG')el.src=reader.result;else{const fallback=$(fallbackId);if(fallback){const img=document.createElement('img');img.id=imgId;img.src=reader.result;img.className=field==='avatar'?'upload-pic':'';img.alt='Uploaded preview';fallback.replaceWith(img)}}toast('Image added to local draft');};reader.readAsDataURL(file)}
  function render(){const app=$('app');if(!app)return; app.innerHTML=`<div class="shell ${s.settings.reduceMotion?'reduce-motion':''}">${s.page==='chat'?chatPage():topbar()+(s.page==='home'?home():s.page==='chats'?chatsPage():s.page==='create'?createPage():profilePage())+bottomnav()}${modalHTML()}</div>`;if(s.page==='chat'){const el=$('chatscroll');if(el)el.scrollTop=el.scrollHeight} }

  function scriptedPreview(st,user,history){
    const name=st.characterName||(st.name==='Rosemont Academy'?'Maren':st.character.split(/[,.\n—]/)[0].trim().split(' ').slice(0,3).join(' '));
    const lines=[
      `*${name} studies you for a moment, clearly weighing your words.*\n\n"That's one way to look at it. But what made you decide that?"`,
      `*A quiet sound from the corridor interrupts the conversation. ${name} glances toward the door, then back at you.*\n\n"Before we continue, there's something you should know."`,
      `*The atmosphere shifts. ${name} folds their arms, looking more intrigued than before.*\n\n"You keep surprising me. Maybe we should try a different approach."`,
      `*For a beat, ${name} says nothing. Then a quick, genuine smile breaks through.*\n\n"All right. I'll take you seriously. What's your next move?"`,
      `*An unexpected vibration rattles the nearby window. Somewhere beyond the room, hurried footsteps echo.*\n\n"That wasn't supposed to happen," ${name} mutters. "Come on."`
    ];
    let index=Math.max(0,Math.floor((history.length-1)/2));let v=lines[index%lines.length];
    if(/who (are|is) you|your name|introduce/i.test(user))v=`*${name} lifts an eyebrow with an amused smile.*\n\n"I'm ${name}. But names aren't nearly as interesting as what people do. What should I call you?"`;
    else if(/leave|walk away|go outside|exit/i.test(user))v=`*You move away, and the scene changes around your decision. ${name} watches but makes no attempt to stop you.*\n\n"You have your reasons," they say. "Maybe we'll cross paths again."`;
    else if(/why|secret|truth|explain/i.test(user))v=`*${name} hesitates, visibly deciding how much to reveal.*\n\n"Because not everyone here is telling the truth. And I think you already noticed."`;
    if(st.romance&&st.romance!=='none'&&!/leave|walk away|exit/i.test(user)){
      const emotional=st.romance==='slow-burn'?'*A little of the distance between you seems to disappear.*':st.romance==='playful'?'*There is a playful glint in their eyes.*':'*Their expression softens for a moment.*';
      if(/smile|hello|hi|flirt|love|cute|beautiful|handsome|like you/i.test(user))v=`${emotional}\n\n"You're going to make it hard for me to pretend I don't enjoy your company," ${name} admits with a half-smile.`;
    }
    if(st.dynamic==='assertive'&&/what now|decide|lead|your plan|next move/i.test(user))v=`*${name} straightens with quiet confidence, considering the scene.*\n\n"I have a plan. Hear me out — and tell me if you're in."`;
    return v;
  }
  async function sendMessage(raw){const text=raw.trim();if(!text||replyBusy)return;if(text.length>1800){toast('Please keep messages under 1,800 characters');return}if(s.credits<COST){modal='wallet';render();toast(`You need at least ${COST} coins to send this message`);return}const id=s.active,chat=s.chats[id],st=storyById(chat?.storyId);if(!chat||!st)return;replyBusy=true;
    const previous=chat.messages.map(m=>({role:m.role,text:m.text}));
    chat.messages.push({role:'user',text,at:Date.now()});chat.updated=Date.now();persist();render();const typing=$('typingarea');if(typing)typing.innerHTML='<div class="typing" aria-label="Reply in progress"><i></i><i></i><i></i></div>';$('chatscroll')?.scrollTo({top:999999,behavior:'smooth'});
    try {
      let response;
      if(s.mode==='live'){
        const result=await api('/api/reply',{method:'POST',body:JSON.stringify({story:st,persona:s.persona,messages:previous,message:text,idempotencyKey:uid()})});
        if(!result?.reply)throw Error('AI returned an empty response');response=result.reply;s.credits=result.balance;
      }else{
        await new Promise(r=>setTimeout(r,700+Math.random()*600));response=scriptedPreview(st,text,previous);s.credits-=COST;
      }
      if(s.chats[id]){s.chats[id].messages.push({role:'assistant',text:response,at:Date.now()});s.chats[id].updated=Date.now()}
    }catch(e){if(s.chats[id])s.chats[id].messages.pop();toast(e.message||'Could not send. Your coins were not charged.')}
    finally{replyBusy=false;persist();render();setTimeout(()=>{$('chatinput')?.focus()},20)}
  }
  async function api(path,options={}){const headers={...(options.body?{'Content-Type':'application/json'}:{}),...(session?{'Authorization':`Bearer ${session}`}:{})};let r=await fetch(path,{...options,headers:{...headers,...options.headers},signal:AbortSignal.timeout(30000)});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Server error (${r.status})`);return d}
  async function bootstrap(){try{const data=await api('/api/session');if(data.session){session=data.session;localStorage.setItem(SESSION_KEY,session)}s.serverConnected=true;if(data.mode==='live'){s.mode='live';s.credits=data.balance}else if(data.mode==='preview'){s.mode='preview'}if(data.creatorStatus){s.creator.status=data.creatorStatus;if(data.creatorInterest)s.creator.interest=data.creatorInterest}try{let shared=await api('/api/stories');s.community=shared.stories||[]}catch(_){}persist();render()}catch(_){s.mode='preview';s.serverConnected=false;persist();render()}}
  function handleClick(e){const el=e.target.closest('[data-action]');if(!el)return;if(e.target.closest('[data-stop]')&&e.target===e.currentTarget)return;const a=el.dataset.action,id=el.dataset.id;
    if(a==='close'){if(e.target.closest('[data-stop]')&&el.classList.contains('modal-scrim'))return;modal='';render();return}
    if(['home','chats','create','profile'].includes(a)){nav(a);return}
    if(a==='open'){openStory(id);return}
    if(a==='resume'){if(s.chats[id]){s.active=id;s.page='chat';modal='';render()}return}
    if(a==='category'){s.category=id;render();return}
    if(a==='previewCreator'){captureEditor();s.previewFields=s.editorDraft?{...s.editorDraft}:{};s.previewTab='feed';modal='characterPreview';render();return}
    if(a==='previewFeed'||a==='previewChat'){s.previewTab=a==='previewFeed'?'feed':'chat';render();return}
    if(a==='addScenario'){captureEditor();s.editorExtra=Math.min(3,(s.editorExtra||0)+1);render();return}
    if(a==='removeScenario'){captureEditor();const no=Number(id);if(no>=2&&no<=4){s.editorExtra=Math.max(0,(s.editorExtra||0)-1);for(const key of Object.keys(s.editorDraft||{}))if(key.startsWith('scenario'+no))delete s.editorDraft[key];toast('Scenario removed from draft');render()}return}
    if(a==='startScenario'){let story=storyById(pendingStoryId),n=Number(id);if(!story||!Number.isInteger(n)||n<0||n>=Math.max(1,(story.scenarios||[]).length)){toast('Scenario unavailable');return}s.active=getChat(story.id,n);s.page='chat';modal='';render();return}
    if(a==='changeScenario'){const c=s.chats[s.active];if(c){pendingStoryId=c.storyId;modal='scenarioPicker';render()}return}
    if(a==='speakMessage'){const c=s.chats[s.active],m=c?.messages?.[Number(id)],story=storyById(c?.storyId);if(!m||m.role!=='assistant')return;if(!('speechSynthesis' in window)){toast('Text-to-speech unavailable in this browser');return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(m.text.replace(/\*([^*]*)\*/g,'$1'));u.rate=story?.spokenVoice==='bright'?1.07:story?.spokenVoice==='deep'?.87:.95;u.pitch=story?.spokenVoice==='deep'?.75:story?.spokenVoice==='bright'?1.18:1;window.speechSynthesis.speak(u);return}
    if(a==='creatorDemo'){s.creator.previewUnlocked=true;s.editingId=null;s.editorDraft=null;s.editorExtra=0;s.editorImage='';s.editorBackground='';persist();render();toast('Demo Creator Studio: private testing only');return}
    if(a==='creatorStatus'){s.creator.previewUnlocked=false;s.editingId=null;s.page='create';persist();render();return}
    if(a==='editStory'){if(!s.creator.previewUnlocked&&s.creator.status!=='approved'){toast('Creator access required');return}const st=s.created.find(x=>x.id===id);if(!st)return;s.editingId=id;s.editorDraft=null;s.editorExtra=Math.max(0,(st.scenarios||[]).length-1);s.editorImage=st.avatar||'';s.editorBackground=st.bgImage||'';s.page='create';render();$('pagecontent')?.scrollTo({top:0});return}
    if(a==='cancelEdit'){s.editingId=null;render();return}
    if(a==='wallet'||a==='persona'||a==='chatOptions'){modal=a;render();return}
    if(a==='suggest'){sendMessage(id);return}
    if(a==='purchase'){modal='payment';render();return}
    if(a==='demoTopup'){s.credits+=20;persist();modal='wallet';render();toast('Added 20 demo-only coins');return}
    if(a==='restart'){if(s.active&&s.chats[s.active]){let c=s.chats[s.active],st=storyById(c.storyId);c.messages=[{role:'assistant',text:st.opening,at:Date.now()}];c.updated=Date.now();persist()}modal='';render();return}
    if(a==='reduceMotion'){s.settings.reduceMotion=!s.settings.reduceMotion;persist();render();return}
    if(a==='publish'){if(s.creator.status!=='approved'||!s.serverConnected){toast('Only verified Creators can submit public stories');return}const st=s.created.find(x=>x.id===id);if(!st||st.submissionId)return;api('/api/stories',{method:'POST',body:JSON.stringify({story:st})}).then(r=>{st.submissionId=r.id;persist();render();toast('Submitted for moderation. Not public yet.')}).catch(e=>toast(e.message));return}
    if(a==='deleteStory'){pendingDelete=id;modal='confirmDelete';render();return}
    if(a==='confirmDelete'){s.created=s.created.filter(x=>x.id!==pendingDelete);for(let [k,c]of Object.entries(s.chats))if(c.storyId===pendingDelete)delete s.chats[k];persist();modal='';render();toast('World removed');return}
    if(a==='clear'){modal='confirmClear';render();return}
    if(a==='confirmClear'){s.chats={};persist();modal='';render();toast('Chats cleared');return}
    if(a==='export'){const b=new Blob([JSON.stringify({stories:s.created,chats:s.chats,persona:s.persona},null,2)],{type:'application/json'});const url=URL.createObjectURL(b);let a=document.createElement('a');a.href=url;a.download='mytha-my-stories.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2500);toast('Your data export is ready');return}
  }
  function handleSubmit(e){if(e.target.id==='chatForm'){e.preventDefault();const field=$('chatinput');if(field)sendMessage(field.value);return}
    if(e.target.id==='personaform'||e.target.id==='profileform'){e.preventDefault();let data=new FormData(e.target);s.persona=(data.get('persona')||'').toString().trim().slice(0,1000);if(e.target.id==='profileform')s.username=(data.get('username')||'Story explorer').toString().trim().slice(0,40)||'Story explorer';persist();modal='';render();toast('Profile saved');return}
    if(e.target.id==='creatorRequestForm'){
      e.preventDefault();const interest=(new FormData(e.target).get('interest')||'').toString().trim();if(interest.length<10){toast('Describe what you would like to create');return}
      if(s.serverConnected){
        api('/api/creator/apply',{method:'POST',body:JSON.stringify({interest})}).then(result=>{s.creator.status=result.status;s.creator.interest=interest;persist();render();toast('Creator application submitted for review')}).catch(err=>toast(err.message||'Could not send application'));
      }else{s.creator.status='pending_local';s.creator.interest=interest;persist();render();toast('Interest saved on this device only')}
      return;
    }
    if(e.target.id==='creatorform'){
      e.preventDefault();if(!s.creator.previewUnlocked&&s.creator.status!=='approved'){toast('Open the Creator Studio first');return}
      const f=new FormData(e.target),get=k=>(f.get(k)||'').toString().trim();
      if(Number(get('age'))<18||Number(get('age'))>120){toast('Character age must be 18–120');return}if(!get('name')||!get('characterName')||!get('characterRole')||!get('character')||!get('reactions')||!get('world')||!get('opening')){toast('Fill in all the required fields');return}
       const tags=get('tags').split(',').map(x=>x.trim()).filter(Boolean);
       if(tags.length>8){toast('Choose no more than eight tags');return}
       const emotions=f.getAll('emotion');if(emotions.length>3){toast('Choose no more than three emotion cues');return}
       const personaCards=get('personaCards').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,5);
       const scenarios=[{title:'Scenario 1',world:get('world'),opening:get('opening')}];
       for(let n=2;n<=1+Math.min(3,s.editorExtra);n++){
         const world=get(`scenario${n}World`),opening=get(`scenario${n}Opening`);
         if(world&&opening)scenarios.push({title:get(`scenario${n}Title`)||`Scenario ${n}`,world,opening});
       }
      const emojis={'Romance':'💗','School Life':'🏛️','Fantasy':'🗡️','Sci-Fi':'🚀','Mystery':'🔮','Adventure':'🧭','Slice of Life':'🌷'},glows=['#cb8ce8','#efaeab','#87bbd2','#98bfa1'];
      const old=s.created.find(x=>x.id===s.editingId)||null;
      const st={id:old?.id||uid(),name:get('name').slice(0,70),author:get('author').slice(0,35)||s.username,genre:get('genre'),characterName:get('characterName').slice(0,50),characterRole:get('characterRole').slice(0,160),character:get('character').slice(0,10000),age:Number(get('age')),gender:get('gender'),bio:get('bio').slice(0,500),spokenVoice:get('spokenVoice'),avatar:s.editorImage||old?.avatar||'',bgImage:s.editorBackground||old?.bgImage||'',scenarios,tags,emotionCues:emotions,personaCards,rating:get('rating'),visibility:get('visibility'),temperament:get('temperament'),dynamic:get('dynamic'),romance:get('romance'),voiceStyle:get('voiceStyle'),reactions:get('reactions').slice(0,1000),boundaries:get('boundaries').slice(0,800),world:get('world').slice(0,2000),rules:get('rules').slice(0,1800),opening:get('opening').slice(0,1600),short:get('short').slice(0,160)||get('world').slice(0,115),description:get('world'),style:get('style'),creativity:get('creativity'),emoji:emojis[get('genre')]||'✨',glow:old?.glow||pick(glows),shade:old?.shade||'#422b55',private:true};
      if(old){if(old.submissionId){toast('An already submitted story cannot be changed during review');return}Object.assign(old,st)}else s.created.unshift(st);
       s.editingId=null;s.editorDraft=null;s.editorExtra=0;s.editorImage='';s.editorBackground='';persist();openStory(st.id);toast(old?'Character settings updated':'Private character saved — test your story');return;
    }
  }
  document.addEventListener('click',handleClick);
  document.addEventListener('submit',handleSubmit);
  document.addEventListener('change',e=>{if(e.target.id==='avatarUpload'){safeImages(e.target.files?.[0],'avatar','avatarPreview','avatarFallback')}if(e.target.id==='backgroundUpload'){safeImages(e.target.files?.[0],'background','backgroundPreview','backgroundFallback')}if(e.target.name==='emotion'&&document.querySelectorAll('input[name="emotion"]:checked').length>3){e.target.checked=false;toast('Choose up to three emotion cues')}});
  document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;s.search=e.target.value;const list=$('storygrid');if(list){const arr=allStories().filter(x=>(s.category==='All'||x.genre===s.category)&&(x.name+' '+x.genre+' '+x.short+' '+x.author).toLowerCase().includes(s.search.toLowerCase()));list.innerHTML=arr.length?arr.map(card).join(''):'<div class="no-results">No stories found</div>'}}if(e.target.id==='chatinput'){e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,118)+'px'}});
  document.addEventListener('keydown',e=>{if(e.target.id==='chatinput'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage(e.target.value)}if(e.key==='Escape'&&modal){modal='';render()}if(e.target.classList?.contains('featured')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openStory('rosemont')}});
  render();bootstrap();
  if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
