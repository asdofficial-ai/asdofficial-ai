name: ULTRON Android APK
on:
  push:
    branches:
      - feature/ultron-android-lockwake-20261009
    paths:
      - 'ultron-android/**'
      - '.github/workflows/ultron-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate preinstalled Android SDK
        id: sdk
        run: |
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
      - uses: gradle/actions/setup-gradle@v4
        id: gradle
        with:
          gradle-version: '8.10.2'
      - name: Bundle official Vosk offline model
        id: model
        working-directory: ultron-android
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --max-time 200 "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" --output /tmp/ultron-model.zip
          unzip -q /tmp/ultron-model.zip -d app/src/main/assets
          test -s app/src/main/assets/vosk-model-small-en-us-0.15/am/final.mdl
          mv app/src/main/assets/vosk-model-small-en-us-0.15 app/src/main/assets/vosk-en-us-small-015
      - name: Compile installable debug APK and tests
        id: build
        working-directory: ultron-android
        run: |
          set +e
          gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace > /tmp/ultron-build.log 2>&1
          result=$?
          tail -n 70 /tmp/ultron-build.log
          exit "$result"
      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: ULTRON-Android-v0.2-apk
          path: ultron-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish public prerelease APK
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "ultron-android-v0.2.0-alpha.1" "ultron-android/app/build/outputs/apk/debug/app-debug.apk#ULTRON-Android-Voice-Wake-v0.2-debug.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ULTRON Android 0.2 alpha offline wake APK" --notes "Experimental offline foreground microphone wake prototype; device testing is necessary." --prerelease
      - name: Record verification result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JAVA: ${{ steps.java.outcome }}
          SDK: ${{ steps.sdk.outcome }}
          GRADLE: ${{ steps.gradle.outcome }}
          MODEL: ${{ steps.model.outcome }}
          BUILD: ${{ steps.build.outcome }}
          ARTIFACT: ${{ steps.artifact.outcome }}
          RELEASE: ${{ steps.release.outcome }}
        run: |
          set -euo pipefail
          msg="ULTRON CI: java=$JAVA sdk=$SDK gradle=$GRADLE model=$MODEL build=$BUILD artifact=$ARTIFACT release=$RELEASE commit=$GITHUB_SHA"
          if [ -f /tmp/ultron-build.log ]; then msg="$msg ERRORS: $(grep -E '^e:|^FAILURE:|^> |^\* What went wrong' /tmp/ultron-build.log | tail -n 18 | tr '\n' ' ' || true)"; fi
          encoded="$(printf '%s' "$msg" | base64 -w0)"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/build-status/ultron-android-ci.txt?ref=$GITHUB_REF_NAME" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/build-status/ultron-android-ci.txt" -f "message=ULTRON APK CI status" -f "branch=$GITHUB_REF_NAME" -f "sha=$sha" -f "content=$encoded"
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/build-status/ultron-android-ci.txt" -f "message=ULTRON APK CI status" -f "branch=$GITHUB_REF_NAME" -f "content=$encoded"
          fi
